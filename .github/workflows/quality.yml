name: Quality

on:
  pull_request:
  push:

jobs:
  api-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anotherme
          POSTGRES_USER: anotherme
          POSTGRES_PASSWORD: anotherme-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anotherme -d anotherme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://anotherme:anotherme-ci@127.0.0.1:5432/anotherme
      REDIS_URL: redis://127.0.0.1:6379
      RUN_INFRA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/api-server test
      - run: pnpm --filter @workspace/mobile run typecheck

  production-builds:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PORT: "4173"
      PWA_ORIGIN: https://ci.anotherme.invalid
      PWA_BASE_PATH: /app
      EXPO_PUBLIC_DOMAIN: ci.anotherme.invalid
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/landing run build
      - run: pnpm --filter @workspace/mockup-sandbox run build
      - run: pnpm --filter @workspace/mobile run build
