name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/latest-development-handoff
    paths:
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_PUBLIC_API_BASE_URL: https://api.anothermeai.app
      EXPO_PUBLIC_DOMAIN: api.anothermeai.app
      EXPO_PUBLIC_CLERK_PROXY_URL: https://anothermeai.app/api/__clerk

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: pnpm install --frozen-lockfile

      - name: Resolve the public Clerk key
        env:
          CONFIGURED_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          async function main() {
            let key = process.env.CONFIGURED_CLERK_KEY?.trim();
            if (!key) {
              const html = await fetch("https://anothermeai.app/app/").then((response) => {
                if (!response.ok) throw new Error(`PWA request failed: ${response.status}`);
                return response.text();
              });
              const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js)["']/g)]
                .map((match) => new URL(match[1], "https://anothermeai.app/app/").href);
              for (const script of scripts) {
                const source = await fetch(script).then((response) => response.text());
                key = source.match(/pk_(?:live|test)_[A-Za-z0-9_-]+/)?.[0];
                if (key) break;
              }
            }
            if (!key) throw new Error("Unable to resolve EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY");
            fs.appendFileSync(process.env.GITHUB_ENV, `EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${key}\n`);
          }

          main();
          NODE

      - name: Generate the native Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build release APK on the runner
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Verify APK package, version, native services, ABIs, and signature
        working-directory: artifacts/mobile
        run: pnpm run verify:android-apk -- android/app/build/outputs/apk/release/app-release.apk 7

      - name: Stage artifact
        run: cp artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk anotherme-v7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anotherme-android-v7
          path: anotherme-v7.apk
          if-no-files-found: error
          retention-days: 30
