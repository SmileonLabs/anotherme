name: anotherme-prod

x-api-build: &api-build
  image: ${API_IMAGE:-anotherme-api:prod}
  build:
    context: .
    dockerfile: docker/api.Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  PORT: "8080"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://anothermeai.app}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
  LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_PRIVATE_PREFIX: ${S3_PRIVATE_PREFIX:-private}
  S3_PUBLIC_PREFIXES: ${S3_PUBLIC_PREFIXES:-public}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@anothermeai.app}
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
  STAR_NFT_RPC_URL: ${STAR_NFT_RPC_URL:-}
  STAR_NFT_CONTRACT_ADDRESS: ${STAR_NFT_CONTRACT_ADDRESS:-}
  STAR_NFT_CHAIN_ID: ${STAR_NFT_CHAIN_ID:-}
  STAR_NFT_IDENTITY_MAP: ${STAR_NFT_IDENTITY_MAP:-}
  KNOWLEDGE_ADMIN_USER_IDS: ${KNOWLEDGE_ADMIN_USER_IDS:-}
  GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
  GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID:-}
  NEO4J_URI: ${NEO4J_URI:-neo4j://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-anotherme-local-neo4j-change-me}

services:
  proxy:
    image: caddy:2.10-alpine
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/landing/dist/public:/srv/landing:ro
      - ./artifacts/mobile/web-build:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  app-a:
    <<: *api-build
    environment:
      <<: *api-env
      INSTANCE_NAME: app-a
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app-b:
    <<: *api-build
    environment:
      <<: *api-env
      INSTANCE_NAME: app-b
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-anotherme-local-neo4j-change-me}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-build
    command: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    profiles:
      - tools
    restart: "no"

  neo4j-init:
    <<: *api-build
    command: ["node", "--enable-source-maps", "artifacts/api-server/dist/scripts/initializeKnowledgeGraph.mjs"]
    environment:
      <<: *api-env
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

volumes:
  caddy-data:
  caddy-config:
  neo4j-data:
